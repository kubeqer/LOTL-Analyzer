name: lint-python

on:
  push:
    branches: [master]
    paths:
      - "src/log_analyzer_ml/**"
      - ".github/workflows/lint-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/log_analyzer_ml/**"
      - ".github/workflows/lint-python.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: src/log_analyzer_ml

jobs:
  lint:
    name: ruff check + format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: ruff check
        run: uvx run ruff check .
      - name: ruff format --check
        run: uvx run ruff format --check .
