name: lint-python

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - "apps/log_analyzer_ml/**"
      - ".github/workflows/lint-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/backend/**"
      - "apps/log_analyzer_ml/**"
      - ".github/workflows/lint-python.yml"
  workflow_dispatch:

jobs:
  lint:
    name: ruff check + format (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, log_analyzer_ml]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format --check
        run: uvx ruff format --check .
